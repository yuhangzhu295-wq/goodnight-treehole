name: Live AI Verification

'on':
  workflow_dispatch:
    inputs:
      spec:
        description: 'Target test spec path (leave blank to run all live AI acceptance specs)'
        required: false
        default: ''

jobs:
  live-ai:
    name: Live AI Acceptance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goodnight
          POSTGRES_PASSWORD: goodnight
          POSTGRES_DB: goodnight_treehole
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://goodnight:goodnight@127.0.0.1:5432/goodnight_treehole?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TEST_PG_PORT: '5432'
      TEST_MAINTENANCE_DB: postgres
      DAPI_API_KEY: ${{ secrets.DAPI_API_KEY || secrets.AI_PRIMARY_API_KEY || secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Verify Live AI Secret Presence
        run: |
          if [ -z "$DAPI_API_KEY" ]; then
            echo "================================================================================"
            echo "::error::NOT_RUN_NO_SECRET: DAPI_API_KEY secret is absent or unconfigured."
            echo "================================================================================"
            echo "### Live AI Execution Status: NOT_RUN_NO_SECRET" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: \`NOT_RUN_NO_SECRET\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason**: The required remote AI secret (\`DAPI_API_KEY\`, \`AI_PRIMARY_API_KEY\`, or \`DEEPSEEK_API_KEY\`) was not found in the workflow environment." >> $GITHUB_STEP_SUMMARY
            echo "- **Integrity**: Live AI tests cannot pass without authentic credentials. Reporting \`NOT_RUN_NO_SECRET\` prevents false-green claims and keeps \`AI_LIVE_BLOCKED_EXTERNAL\` status honest." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Live AI secret verified. Proceeding with execution."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test database with prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run Live AI Acceptance Specs
        run: |
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            echo "Running specified target: ${{ github.event.inputs.spec }}"
            pnpm exec tsx scripts/test-runner.ts vitest run "${{ github.event.inputs.spec }}"
          else
            echo "Running all live-AI acceptance specs and DAPI live audit"
            pnpm exec tsx scripts/test-runner.ts vitest run tests/business/peer-support-stage.spec.ts tests/cross/cross.spec.ts tests/business/third-stage-memory-independent.spec.ts
          fi

      - name: Run DAPI Live Audit Script
        run: pnpm exec tsx scripts/dapi-live-audit.ts

      - name: Report Live AI Success
        if: success()
        run: |
          echo "### Live AI Execution Status: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: \`PASSED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Details**: Live AI jobs succeeded against remote DAPI endpoint." >> $GITHUB_STEP_SUMMARY

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ai-artifacts
          path: |
            artifacts/runtime/
            artifacts/test-report/
          if-no-files-found: ignore
