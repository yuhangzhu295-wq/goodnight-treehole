name: CI

'on':
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression Gate and Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goodnight
          POSTGRES_PASSWORD: goodnight
          POSTGRES_DB: goodnight_treehole
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://goodnight:goodnight@127.0.0.1:5432/goodnight_treehole?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TEST_PG_PORT: '5432'
      TEST_MAINTENANCE_DB: postgres
      DAPI_API_KEY: ''
      # Test-only signing keys for this job's throwaway database.
      #
      # The API deliberately refuses admin and C-end authentication when no secret is configured: a
      # missing secret must not fall back to accepting unsigned credentials. CI previously had no
      # secret and only passed because the admin token was unsigned, so making that fail closed
      # turned every business spec's `loginAdmin` into a 401 at setup - six files failing with zero
      # tests run. These values are not production secrets and protect nothing outside this job.
      JWT_SECRET: ci-test-only-jwt-secret
      ADMIN_TOKEN_SECRET: ci-test-only-admin-token-secret
      CEND_TOKEN_SECRET: ci-test-only-cend-token-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration immutability check
        run: pnpm exec tsx scripts/check-migration-immutability.ts

      - name: Build test database with prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      # `@prisma/client` generates its typed client from a postinstall script, and this repo has an
      # `onlyBuiltDependencies` list that does not include it, so pnpm may skip that script. Typecheck
      # imports the generated types, so without this step the run fails with errors like
      # "Property 'anonymousSession' does not exist on type 'PrismaRuntimeService'" - which reads
      # like a code defect and is not one. Generating explicitly removes the dependency on install
      # behaviour that varies between pnpm versions.
      - name: Generate Prisma client
        run: pnpm exec prisma generate --schema prisma/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Run regression gate (Batch 1 specs + persistence-durability)
        run: pnpm test:batch1

      - name: Run full business suite
        id: full_suite
        continue-on-error: true
        run: pnpm exec tsx scripts/test-runner.ts

      - name: Verify failures against known baseline diff
        id: baseline_diff
        run: pnpm exec tsx scripts/check-baseline-failures.ts

      - name: Report full business suite results honestly
        if: always()
        run: |
          echo "### Full Business Suite Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Suite Execution Outcome**: \`${{ steps.full_suite.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Baseline Diff Check Outcome**: \`${{ steps.baseline_diff.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.baseline_diff.outcome }}" = "failure" ]; then
            echo "- **Status**: FAILED_NEW_REGRESSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Note**: The full business suite produced test failure(s) not present in \`docs/architecture/TEST_BASELINE_FAILURES.md\`. CI failed on regression." >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ steps.full_suite.outcome }}" = "failure" ]; then
            echo "- **Status**: COMPLETED_WITH_KNOWN_BASELINE_FAILURES" >> $GITHUB_STEP_SUMMARY
            echo "- **Note**: The full business suite completed with failures, and the machine-checked diff verified that 100% of the failures match the known baseline in \`docs/architecture/TEST_BASELINE_FAILURES.md\`. No new regressions detected." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.full_suite.outcome }}" = "success" ]; then
            echo "- **Status**: PASSED (all tests in full business suite passed)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Full business suite was skipped or cancelled! Workflow cannot claim success when a required execution step was omitted."
            echo "- **Status**: NOT_RUN (${{ steps.full_suite.outcome }})" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts/runtime/
            artifacts/test-report/
          if-no-files-found: ignore
