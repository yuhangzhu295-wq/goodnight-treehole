name: CI

'on':
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression Gate and Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goodnight
          POSTGRES_PASSWORD: goodnight
          POSTGRES_DB: goodnight_treehole
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://goodnight:goodnight@127.0.0.1:5432/goodnight_treehole?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TEST_PG_PORT: '5432'
      TEST_MAINTENANCE_DB: postgres
      DAPI_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration immutability check
        run: pnpm exec tsx scripts/check-migration-immutability.ts

      - name: Build test database with prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Run regression gate (Batch 1 specs + persistence-durability)
        run: pnpm test:batch1

      - name: Run full business suite
        id: full_suite
        continue-on-error: true
        run: pnpm exec tsx scripts/test-runner.ts

      - name: Report full business suite results honestly
        if: always()
        run: |
          echo "### Full Business Suite Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome**: \`${{ steps.full_suite.outcome }}\`" >> $GITHUB_STEP_SUMMARY
          case "${{ steps.full_suite.outcome }}" in
            success)
              echo "- **Status**: PASSED (all tests in full business suite passed)" >> $GITHUB_STEP_SUMMARY
              ;;
            failure)
              echo "- **Status**: COMPLETED_WITH_FAILURES_BASELINE_IDENTITY_NOT_VERIFIED" >> $GITHUB_STEP_SUMMARY
              echo "- **Note**: The full business suite completed and its results are published. This label does **not** assert that the failures are the known baseline set — the workflow does not currently diff the failing-test identity, so it cannot distinguish a pre-existing failure from a new regression here." >> $GITHUB_STEP_SUMMARY
              echo "- **Required follow-up**: add a machine-checked failing-set diff against \`docs/architecture/TEST_BASELINE_FAILURES.md\` so a new failure fails this job. Tracked in \`docs/architecture/BATCH1_FINAL_GATE.md\`." >> $GITHUB_STEP_SUMMARY
              ;;
            skipped|cancelled)
              echo "::error::Full business suite was skipped or cancelled! Workflow cannot claim success when a required execution step was omitted."
              echo "- **Status**: NOT_RUN (${{ steps.full_suite.outcome }})" >> $GITHUB_STEP_SUMMARY
              exit 1
              ;;
            *)
              echo "::error::Unexpected step outcome: ${{ steps.full_suite.outcome }}"
              exit 1
              ;;
          esac

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts/runtime/
            artifacts/test-report/
          if-no-files-found: ignore
